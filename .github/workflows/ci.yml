name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux' && contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp-dev libcap-dev

      - name: Verify Docker availability (Docker-first runtime gate)
        run: |
          echo "Verifying Docker is available as default container runtime..."
          if command -v docker >/dev/null 2>&1; then
            docker --version
            docker info --format '{{.ServerVersion}}' || true
            echo "Docker is available"
          else
            echo "WARNING: Docker is not installed; tests will fallback to bwrap/mock where applicable"
          fi

      - name: Verify default runtime selection
        run: |
          echo "Verifying default container runtime is Docker..."
          # Ensure dependencies are available
          go mod download
          # Verify default config programmatically
          go run -mod=mod - <<'EOF'
          package main
          import (
            "fmt"
            "os"
            "keeper/pkg/config"
          )
          func main() {
            cfg := config.DefaultConfig()
            fmt.Printf("Default container runtime: %s\n", cfg.ContainerRuntime)
            if cfg.ContainerRuntime != "docker" {
              fmt.Println("ERROR: default container runtime is not docker")
              os.Exit(1)
            }
          }
          EOF

      - name: Verify Go installation
        run: go version

      - name: Build binary
        run: go build -o bin/keeper ./cmd/keeper

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests
        run: go test ./...
        env:
          KEEPER_BIN: ${{ github.workspace }}/bin/keeper

      - name: Run cold-start benchmarks
        run: |
          go test -bench=BenchmarkStartup -benchmem -run=^$ ./benchmarks/...
        env:
          KEEPER_BIN: ${{ github.workspace }}/bin/keeper

      - name: Check binary size
        run: |
          SIZE=$(stat -f%z bin/keeper 2>/dev/null || stat -c%s bin/keeper)
          echo "Binary size: $SIZE bytes"
          if [ $SIZE -gt 20971520 ]; then
            echo "ERROR: Binary size exceeds 20MB limit"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt check
        run: |
          if [ "$(gofmt -d . | wc -l)" -gt 0 ]; then
            echo "gofmt found issues:"
            gofmt -d .
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build for ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          GOARCH=${{ matrix.goarch }} go build -o bin/keeper-${{ matrix.goarch }} ./cmd/keeper

      - name: Verify binary
        if: matrix.goarch == 'amd64'
        run: |
          chmod +x bin/keeper-${{ matrix.goarch }}
          ./bin/keeper-${{ matrix.goarch }} version

      - name: Verify binary (arm64 cross-compile check)
        if: matrix.goarch == 'arm64'
        run: |
          chmod +x bin/keeper-${{ matrix.goarch }}
          echo "arm64 binary built successfully (size: $(stat -c%s bin/keeper-${{ matrix.goarch }}) bytes)"
          echo "Note: Cannot execute arm64 binary on x86_64 runner, verification skipped"

      - name: Check binary size
        run: |
          SIZE=$(stat -f%z bin/keeper-${{ matrix.goarch }} 2>/dev/null || stat -c%s bin/keeper-${{ matrix.goarch }})
          echo "Binary size (${{ matrix.goarch }}): $SIZE bytes"
          if [ $SIZE -gt 20971520 ]; then
            echo "ERROR: Binary size exceeds 20MB limit"
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: keeper-${{ matrix.goarch }}
          path: bin/keeper-${{ matrix.goarch }}
          retention-days: 7

  kernel-compatibility:
    name: Kernel compatibility check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Check kernel version
        run: |
          KERNEL=$(uname -r)
          echo "Kernel version: $KERNEL"
          MAJOR=$(echo $KERNEL | cut -d. -f1)
          MINOR=$(echo $KERNEL | cut -d. -f2)
          if [ "$MAJOR" -lt 5 ] || ([ "$MAJOR" -eq 5 ] && [ "$MINOR" -lt 11 ]); then
            echo "WARNING: Kernel < 5.11, CONFIG_OVERLAY_FS_USERNS may not be available"
          else
            echo "Kernel >= 5.11, checking CONFIG_OVERLAY_FS_USERNS..."
            if grep -q "CONFIG_OVERLAY_FS_USERNS=y" /boot/config-$(uname -r) 2>/dev/null || \
               grep -q "CONFIG_OVERLAY_FS_USERNS=y" /proc/config.gz 2>/dev/null; then
              echo "CONFIG_OVERLAY_FS_USERNS is enabled"
            else
              echo "WARNING: CONFIG_OVERLAY_FS_USERNS not found in kernel config"
            fi
          fi

      - name: Test bwrap basic functionality
        run: |
          if command -v bwrap >/dev/null 2>&1; then
            echo "Testing basic bwrap..."
            bwrap --ro-bind / / --dev /dev --unshare-user --unshare-pid --proc /proc -- /bin/echo "bwrap works" || \
            echo "bwrap test failed (expected on some environments)"
          else
            echo "bwrap not installed"
          fi

      - name: Build and verify
        run: |
          go build -o bin/keeper ./cmd/keeper
          ./bin/keeper version

  bootstrap:
    name: Bootstrap probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: sudo apt-get install -y bubblewrap libseccomp-dev

      - name: Run bootstrap tests
        run: go test -v ./internal/bootstrap/...

      - name: Run environment probe
        run: |
          PROBE_OUTPUT=$(go run ./internal/bootstrap/probe.go 2>/dev/null || echo '{"error": "probe failed"}')
          echo "Probe result: $PROBE_OUTPUT"

  bwrap-integration:
    name: bwrap integration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp-dev libcap-dev

      - name: Check kernel support
        run: |
          KERNEL=$(uname -r)
          echo "Kernel version: $KERNEL"
          MAJOR=$(echo $KERNEL | cut -d. -f1)
          MINOR=$(echo $KERNEL | cut -d. -f2)
          if [ "$MAJOR" -lt 5 ] || ([ "$MAJOR" -eq 5 ] && [ "$MINOR" -lt 11 ]); then
            echo "WARNING: Kernel < 5.11, skipping bwrap integration tests"
            echo "SKIP_BWRAP=true" >> $GITHUB_ENV
          else
            echo "Kernel >= 5.11, checking CONFIG_OVERLAY_FS_USERNS..."
            if grep -q "CONFIG_OVERLAY_FS_USERNS=y" /boot/config-$(uname -r) 2>/dev/null || \
               grep -q "CONFIG_OVERLAY_FS_USERNS=y" /proc/config.gz 2>/dev/null; then
              echo "CONFIG_OVERLAY_FS_USERNS is enabled"
              echo "SKIP_BWRAP=false" >> $GITHUB_ENV
            else
              echo "WARNING: CONFIG_OVERLAY_FS_USERNS not found, skipping bwrap integration tests"
              echo "SKIP_BWRAP=true" >> $GITHUB_ENV
            fi
          fi

      - name: Run bwrap integration tests
        if: env.SKIP_BWRAP != 'true'
        run: go test -v ./internal/container/ -run "Bwrap" -timeout 10m

      - name: Skip bwrap integration tests
        if: env.SKIP_BWRAP == 'true'
        run: echo "Skipping bwrap integration tests due to missing kernel support"

  docker-runtime:
    name: Docker runtime gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install and start Docker
        run: |
          echo "Setting up Docker..."
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker not found, installing..."
            sudo apt-get update
            sudo apt-get install -y docker.io
          else
            echo "Docker already installed: $(docker --version)"
          fi
          # Start Docker daemon (service is preferred on Ubuntu runners)
          sudo service docker start || true
          # Wait for Docker to become ready
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Waiting for Docker... ($i/30)"
            sleep 1
          done
          docker info --format '{{.ServerVersion}}' || {
            echo "ERROR: Docker daemon is not available"
            exit 1
          }

      - name: Verify default runtime is Docker
        run: |
          go run -mod=mod - <<'EOF'
          package main
          import (
            "fmt"
            "keeper/pkg/config"
          )
          func main() {
            cfg := config.DefaultConfig()
            fmt.Printf("Default container runtime: %s\n", cfg.ContainerRuntime)
            if cfg.ContainerRuntime != "docker" {
              fmt.Println("ERROR: default container runtime is not docker")
              panic("default runtime gate failed")
            }
          }
          EOF

      - name: Run Docker container tests
        run: go test -v ./internal/container/ -run "Docker" -timeout 10m
